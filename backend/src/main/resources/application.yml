spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agent_db}
    username: ${SPRING_DATASOURCE_USERNAME:agent_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: admin
      password: admin
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}

jwt:
  secret: ${JWT_SECRET:replace-with-a-long-random-secret}
  expirationMs: 86400000

app:
  ai-provider: ${AI_PROVIDER:mock}
  telephony-provider: ${TELEPHONY_PROVIDER:mock}
  crm-provider: ${CRM_PROVIDER:mock}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
